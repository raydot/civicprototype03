<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Educational Resources Admin - VoterPrime</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h1 {
        font-size: 28px;
        font-weight: 600;
      }

      .header p {
        opacity: 0.9;
        margin-top: 5px;
      }

      .main-content {
        padding: 30px;
      }

      .filters {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .search-box {
        flex: 1;
        min-width: 300px;
      }

      .search-box input {
        width: 100%;
        padding: 12px 20px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.3s;
      }

      .search-box input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .filter-select {
        padding: 12px 20px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 14px;
        background: white;
        cursor: pointer;
        transition: all 0.3s;
      }

      .filter-select:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .btn-secondary {
        background: #e2e8f0;
        color: #4a5568;
      }

      .btn-secondary:hover {
        background: #cbd5e0;
      }

      .btn-danger {
        background: #f56565;
        color: white;
      }

      .btn-danger:hover {
        background: #e53e3e;
      }

      .categories-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .category-card {
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        transition: all 0.3s;
        cursor: pointer;
      }

      .category-card:hover {
        border-color: #667eea;
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        transform: translateY(-2px);
      }

      .category-card.selected {
        border-color: #667eea;
        background: #f7fafc;
      }

      .category-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 12px;
      }

      .category-title {
        font-size: 18px;
        font-weight: 600;
        color: #2d3748;
      }

      .category-badge {
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .badge-issue {
        background: #bee3f8;
        color: #2c5282;
      }

      .badge-policy {
        background: #c6f6d5;
        color: #22543d;
      }

      .category-description {
        color: #718096;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 12px;
      }

      .category-stats {
        display: flex;
        gap: 15px;
        font-size: 13px;
        color: #718096;
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .resources-section {
        margin-top: 30px;
        padding-top: 30px;
        border-top: 2px solid #e2e8f0;
      }

      .resources-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .resources-header h2 {
        font-size: 24px;
        color: #2d3748;
      }

      .resources-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .resource-item {
        background: #f7fafc;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        padding: 20px;
        transition: all 0.3s;
      }

      .resource-item:hover {
        border-color: #cbd5e0;
      }

      .resource-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 10px;
      }

      .resource-title {
        font-size: 16px;
        font-weight: 600;
        color: #2d3748;
        flex: 1;
      }

      .resource-actions {
        display: flex;
        gap: 8px;
      }

      .icon-btn {
        padding: 8px;
        border: none;
        background: transparent;
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.2s;
        color: #718096;
      }

      .icon-btn:hover {
        background: #e2e8f0;
        color: #2d3748;
      }

      .resource-meta {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 10px;
        font-size: 13px;
        color: #718096;
      }

      .resource-description {
        color: #4a5568;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .resource-url {
        color: #667eea;
        font-size: 13px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .resource-url:hover {
        text-decoration: underline;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal {
        background: white;
        border-radius: 12px;
        padding: 30px;
        max-width: 600px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal h2 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #2d3748;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #2d3748;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 100px;
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      .form-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 30px;
      }

      .loading {
        text-align: center;
        padding: 60px 20px;
        color: #718096;
      }

      .spinner {
        border: 3px solid #e2e8f0;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #718096;
      }

      .empty-state-icon {
        font-size: 48px;
        margin-bottom: 15px;
      }

      .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background: white;
        padding: 16px 24px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 2000;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .toast.success {
        border-left: 4px solid #48bb78;
      }

      .toast.error {
        border-left: 4px solid #f56565;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <h1>📚 Educational Resources Admin</h1>
          <p>Manage educational resources for political categories</p>
        </div>
      </div>

      <div class="main-content">
        <!-- Filters -->
        <div class="filters">
          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="🔍 Search categories..."
            />
          </div>
          <select id="typeFilter" class="filter-select">
            <option value="all">All Types</option>
            <option value="issue">Issues</option>
            <option value="policy">Policies</option>
          </select>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">
          <div class="spinner"></div>
          <p>Loading categories...</p>
        </div>

        <!-- Categories Grid -->
        <div
          id="categoriesGrid"
          class="categories-grid"
          style="display: none"
        ></div>

        <!-- Resources Section -->
        <div
          id="resourcesSection"
          class="resources-section"
          style="display: none"
        >
          <div class="resources-header">
            <h2 id="selectedCategoryName">Resources</h2>
            <button class="btn btn-primary" onclick="openAddResourceModal()">
              ➕ Add Resource
            </button>
          </div>
          <div id="resourcesList" class="resources-list"></div>
        </div>
      </div>
    </div>

    <!-- Add/Edit Resource Modal -->
    <div id="resourceModal" class="modal-overlay">
      <div class="modal">
        <h2 id="modalTitle">Add Resource</h2>
        <form id="resourceForm">
          <input type="hidden" id="resourceId" />
          <input type="hidden" id="categoryId" />

          <div class="form-group">
            <label for="resourceTitle">Title *</label>
            <input type="text" id="resourceTitle" required />
          </div>

          <div class="form-group">
            <label for="resourceSource">Source *</label>
            <input
              type="text"
              id="resourceSource"
              placeholder="e.g., Khan Academy, Ballotpedia"
              required
            />
          </div>

          <div class="form-group">
            <label for="resourceType">Type *</label>
            <select id="resourceType" required>
              <option value="">Select type...</option>
              <option value="article">Article</option>
              <option value="video">Video</option>
              <option value="podcast">Podcast</option>
              <option value="lesson">Lesson</option>
            </select>
          </div>

          <div class="form-group">
            <label for="resourceDuration">Duration</label>
            <input
              type="text"
              id="resourceDuration"
              placeholder="e.g., 10 min read, 15 min video"
            />
          </div>

          <div class="form-group">
            <label for="resourceDescription">Description</label>
            <textarea
              id="resourceDescription"
              placeholder="Brief description of what this resource covers"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="resourceUrl">URL *</label>
            <input
              type="url"
              id="resourceUrl"
              placeholder="https://"
              required
            />
          </div>

          <div class="form-group">
            <label for="resourceOrder">Display Order</label>
            <input type="number" id="resourceOrder" value="0" min="0" />
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeResourceModal()"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save Resource</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/static/js/educational_resources_admin.js"></script>
  </body>
</html>
